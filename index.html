<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes voyages</title>
<meta name="description" content="Carnets de voyage jour par jour : programme, trajets, photos et billets, même sans connexion.">
<meta name="theme-color" content="#fff0f5">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voyages">
<style>
/* Style « appli douce » : pastels, cartes arrondies, une icône colorée par étape */
@font-face{font-family:"Nunito";font-weight:500;font-display:swap;src:url(fonts/nunito-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Nunito";font-weight:500;font-display:swap;src:url(fonts/nunito-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(fonts/nunito-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(fonts/nunito-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --bg:#fff0f5; --surface:#ffffff; --fg:#4a2338; --muted:#a06f88; --rule:#fadbe7;
  --primary:#e2508c; --on-primary:#ffffff; --primary-soft:#ffe1ed;
  --peach:#ffe2d8; --peach-fg:#9a3d22; --butter:#fff1bd; --butter-fg:#755600;
  --mint:#d6f5e8; --mint-fg:#0b6a49; --sky:#dcecff; --sky-fg:#1d589c;
  --lilac:#efe3ff; --lilac-fg:#6b3fb0; --pink:#ffdcea; --pink-fg:#a8285e;
  --danger:#e5484d; --shadow:0 8px 24px rgba(214,70,130,.10); --shade:rgba(80,20,50,.45);
  --f:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:500;font-size:15.5px;line-height:1.55;margin:0;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
img{max-width:100%}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 70px}
h1,h2,h3,h4{font-family:var(--f);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--primary)}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid var(--primary);outline-offset:2px;border-radius:12px}
svg.i{width:1.25em;height:1.25em;flex:none;display:block}
.small{font-size:13.5px;color:var(--muted)}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}

/* tuiles pastel */
.tile{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--lilac);color:var(--lilac-fg)}
.tile svg.i{width:22px;height:22px}
.t-peach{background:var(--peach);color:var(--peach-fg)} .t-butter{background:var(--butter);color:var(--butter-fg)}
.t-mint{background:var(--mint);color:var(--mint-fg)} .t-sky{background:var(--sky);color:var(--sky-fg)}
.t-lilac{background:var(--lilac);color:var(--lilac-fg)} .t-pink{background:var(--pink);color:var(--pink-fg)}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.pill.free{background:var(--mint);color:var(--mint-fg)}
.pill.price{background:var(--sky);color:var(--sky-fg)}
.pill.book{background:var(--pink);color:var(--pink-fg)}
.pill.warn{background:var(--butter);color:var(--butter-fg)}
.pill.out{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--rule)}
.pill.oui{background:var(--mint);color:var(--mint-fg)} .pill.non{background:var(--bg);color:var(--muted)} .pill.jsp{background:var(--butter);color:var(--butter-fg)}
.net{font-weight:800;font-size:12.5px;background:var(--butter);color:var(--butter-fg);padding:5px 12px;border-radius:999px;white-space:nowrap}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14.5px;min-height:44px;padding:10px 18px;border-radius:999px;border:0;color:var(--primary);background:var(--primary-soft);text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(.97)}
.btn.solid{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface);box-shadow:var(--shadow)}
.btn svg.i{width:19px;height:19px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);text-decoration:none;flex:none}
.link{background:none;border:0;padding:6px 0;color:var(--primary);font-weight:800;cursor:pointer;font-size:14px}
.link.danger{color:var(--danger)}

/* ---------- accueil ---------- */
.hello{padding:34px 0 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hi{font-weight:800;color:var(--muted);font-size:15px}
.hello h1{font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.05;margin-top:2px}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px;margin-top:22px}
.trip{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);overflow:hidden;transition:transform .15s}
.trip:hover{transform:translateY(-2px)}
.cover{position:relative;height:190px;margin:10px 10px 0;border-radius:18px;overflow:hidden;background:var(--bg)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:14px}
.cover .mosaic .tile{width:100%;height:100%;border-radius:16px}
.cover .mosaic .tile svg.i{width:34px;height:34px}
.tinfo{padding:16px 20px 20px;display:grid;gap:8px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.trip h2{font-size:28px;line-height:1.1}
.tmeta{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:700;font-size:14.5px}
.tinfo p{color:var(--muted);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{background:var(--bg);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.howto{margin-top:20px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.howto h2{font-size:17px}
.howto p{font-size:14px;color:var(--muted);margin-top:2px;max-width:70ch}

/* ---------- en-tête voyage ---------- */
.tripbar{display:flex;align-items:center;gap:12px;padding-top:16px}
.tripbar .crumb{font-weight:800;color:var(--muted);flex:1}
.hero{margin-top:14px;padding:20px 22px}
.htop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero h1{font-size:clamp(2rem,5vw,2.8rem);line-height:1.05}
.hdates{font-weight:800;color:var(--muted);margin-top:4px}
.hfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.fact{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:9px 12px;min-width:0}
.fact .tile{width:36px;height:36px;border-radius:12px}
.fact .tile svg.i{width:19px;height:19px}
.fact small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.fact b{display:block;font-size:14px;font-weight:800;line-height:1.3}

/* onglets : en haut sur ordinateur, barre flottante en bas sur téléphone */
.secnav{display:flex;gap:6px;margin-top:16px;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--shadow);width:max-content;max-width:100%;overflow-x:auto}
.secnav a{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-weight:800;font-size:14.5px;color:var(--muted);text-decoration:none;position:relative;white-space:nowrap}
.secnav a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.secnav .n{font-size:11px;font-weight:800;background:var(--pink);color:var(--pink-fg);border-radius:999px;padding:0 7px;line-height:18px}

/* ---------- jours ---------- */
nav.days{position:sticky;top:0;z-index:5;background:var(--bg);margin-inline:-18px;padding:12px 18px 10px}
.daylist{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding:2px}
.daylist::-webkit-scrollbar{display:none}
.daypill{flex:none;scroll-snap-align:center;display:grid;justify-items:center;gap:1px;min-width:66px;padding:8px 12px 9px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--fg);position:relative}
.daypill .dn{font-size:11.5px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:5px}
.daypill .dn i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.daypill .dl{font-size:15px;font-weight:800;white-space:nowrap}
.daypill[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.daypill[aria-current="page"] .dn{color:var(--on-primary);opacity:.85}
.daypill[aria-current="page"] .dn i{background:var(--on-primary)}
.daypill .today{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}

main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:16px;align-items:start}
main.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.dayhead{padding:20px 22px}
.dkick{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--primary);font-size:14px}
.dkick i{width:10px;height:10px;border-radius:50%;background:var(--dc)}
.dayhead h2,.pageh{font-size:clamp(1.55rem,3.6vw,2.1rem);line-height:1.15;margin-top:4px}
.daysub{color:var(--muted);margin-top:6px;max-width:62ch}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.notes{display:grid;gap:10px;margin-top:12px}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px}
.note .tile{width:34px;height:34px;border-radius:11px}
.note .tile svg.i{width:18px;height:18px}
.note p{padding-top:6px}

/* étapes */
ol.stops{list-style:none;margin:12px 0 0;padding:0}
.leg{display:flex;align-items:center;gap:8px;margin:0 0 0 30px;padding:10px 0 10px 22px;border-left:2.5px dashed var(--rule);font-size:13px;font-weight:800;color:var(--muted)}
.leg svg.i{width:16px;height:16px}
.scard{padding:16px 16px 14px}
.shead{display:flex;gap:12px;align-items:flex-start}
.smain{min-width:0;flex:1}
.stime{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--muted)}
.stime .must{color:var(--pink-fg);background:var(--pink);border-radius:999px;padding:1px 9px;font-size:11.5px}
.scard h3{font-size:18px;line-height:1.25;margin-top:1px}
.scard h3 a{color:inherit;text-decoration:none}
.scard h3 a:hover{color:var(--primary)}
.addr{font-size:13px;color:var(--muted);margin-top:2px}
.sbody{margin-top:10px}
.sbody > p{font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.alert{margin-top:10px;background:var(--butter);color:var(--butter-fg);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:700}
.adj{margin-top:10px;background:var(--bg);border-radius:14px;padding:9px 12px;font-size:13.5px}
.adj b{color:var(--primary);margin-right:6px;font-weight:800}
details.how{margin-top:12px;background:var(--bg);border-radius:16px;padding:2px 14px}
details.how summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-weight:800;font-size:14.5px;color:var(--primary);list-style:none;padding:10px 0;min-height:44px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .15s}
details.how[open] summary::after{transform:rotate(225deg)}
details.how .from{font-size:13px;color:var(--muted);font-weight:700}
details.how ol,ol.plain{margin:0 0 10px;padding-left:20px;font-size:14px;display:grid;gap:5px}
.mini{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;font-weight:800;font-size:13.5px;color:var(--primary);text-decoration:none}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pth{width:72px;height:72px;border-radius:16px;border:0;padding:0;overflow:hidden;cursor:zoom-in;background:var(--bg);flex:none}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth.more{display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--primary);background:var(--primary-soft);cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13.5px;cursor:pointer;border:0;background:var(--primary-soft);color:var(--primary)}
.chip svg.i{width:18px;height:18px}
.chip.tk{background:var(--pink);color:var(--pink-fg)}
.chip.tk.has{background:var(--pink-fg);color:var(--surface)}
.chip.busy{opacity:.6;pointer-events:none}
.homecard{background:transparent;box-shadow:none;border:2.5px dashed var(--rule)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

aside{display:grid;gap:16px;position:sticky;top:92px}
@media (max-width:900px){aside{position:static}}
.panel{padding:18px}
.panel h3{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:12px}
.panel h3 .tile{width:34px;height:34px;border-radius:11px}
.panel h3 .tile svg.i{width:18px;height:18px}
.big{font-weight:800;font-size:28px;line-height:1.1}
.chk{display:grid;gap:2px}
.chk label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px;font-weight:700;cursor:pointer;padding:6px 0}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--primary)}
.chk input:checked + span{text-decoration:line-through;color:var(--muted)}
.chk em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}
.prog{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}

/* ---------- photos ---------- */
.pgday{margin-top:18px;padding:18px}
.pgday > h3{display:flex;align-items:center;gap:10px;font-size:18px}
.pgday > h3 i{width:10px;height:10px;border-radius:50%;background:var(--dc,var(--primary));flex:none}
.pgday > h3 a{color:inherit;text-decoration:none}
.pgstop{margin-top:14px}
.pgstop h4{font-size:14.5px;color:var(--muted);margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pgrid .pth{width:auto;height:auto;aspect-ratio:1}
.store{margin-top:8px}

/* ---------- billets, budget, infos ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.grid2 .panel p{font-size:14.5px;color:var(--muted)}
.rows{display:grid;margin-top:14px;padding:6px 18px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 0;border-bottom:1.5px solid var(--bg)}
.brow:last-child{border-bottom:0}
.brow b{font-weight:800;font-size:15px}
.brow .bd{font-size:13px;color:var(--muted)}
.brow .bp{text-align:right;font-weight:800;white-space:nowrap}
.brow .bs{text-align:right}
.sum{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.sum > div{background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:14px 18px;display:grid}
.sum .small{font-weight:700}
.bonus{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tgroup{margin-top:20px}
.tgroup h3{font-size:16px;margin-bottom:10px}
.tlist{display:grid;gap:10px}
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:12px}
@media (max-width:520px){.tcard{grid-template-columns:minmax(0,1fr)}}
.tthumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:14px;border:0;background:var(--bg);padding:0;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:var(--fg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.file span{font-weight:800;font-size:13px;color:var(--pink-fg)}
.thumb.file em{font-style:normal;font-size:9.5px;color:var(--muted);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{min-width:0}
.ref{font-size:13.5px;color:var(--muted)}
.ref span{font-weight:800;color:var(--fg);user-select:all}
.tact{display:flex;gap:14px}
.empty{margin-top:18px;padding:22px;display:flex;gap:16px;align-items:center}
.empty p{font-size:14.5px}

/* ---------- dialogues ---------- */
dialog{border:0;border-radius:28px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:var(--shade)}
.dlg{padding:22px;display:grid;gap:12px}
.dlg h2{font-size:22px}
.field{display:grid;gap:5px}
.field label{font-weight:800;font-size:13.5px}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:11px 13px;border:0;border-radius:14px;background:var(--bg);color:var(--fg);width:100%}
.drop{border:2.5px dashed var(--rule);border-radius:18px;padding:16px;text-align:center;cursor:pointer;color:var(--primary);font-weight:800;display:block}
#tFiles{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.err{color:var(--danger);font-size:13.5px;font-weight:700;min-height:1em}
.dlgbar{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
#vdlg{width:min(900px,calc(100vw - 16px))}
#vBody{background:#fff;display:grid;place-items:center;min-height:200px;border-radius:16px;overflow:hidden}
#vBody img{display:block;max-height:72dvh;object-fit:contain}
#vBody object{width:100%;height:72dvh}

#lb{width:100vw;height:100dvh;max-width:none;max-height:none;border-radius:0;background:#1f0d17;color:#fff;margin:0}
#lb[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.lbtop{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 8px}
.lbtop .lbt{flex:1;min-width:0;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtop .lbc{font-weight:700;font-size:14px;opacity:.75}
.lbstage{position:relative;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center}
.lbnav:disabled{opacity:0;pointer-events:none}
.lbnav.prev{left:14px}.lbnav.next{right:14px}
.lbbar{display:grid;gap:10px;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.lbbar input{font:inherit;font-size:16px;padding:12px 14px;border-radius:16px;border:0;background:rgba(255,255,255,.1);color:#fff;width:100%}
.lbbar input::placeholder{color:rgba(255,255,255,.55)}
.lbact{display:flex;gap:8px;flex-wrap:wrap}
.lbbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 16px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none}
.lbbtn svg{width:18px;height:18px}
.lbbtn.close{width:44px;padding:0;justify-content:center}
.lbbtn.danger{background:rgba(255,110,115,.18);color:#ffb0b3}

.erow{display:flex;gap:10px;flex-wrap:wrap}
fieldset.split{border:0;padding:0;margin:0}
fieldset.split legend{font-weight:800;font-size:13.5px;padding:0;display:flex;align-items:center;gap:10px;width:100%}
#eSplit{background:var(--bg);border-radius:14px;padding:6px 12px;margin-top:5px}
#eSplit input:checked + span{text-decoration:none;color:inherit}
.btn.danger-soft{background:var(--pink);color:var(--pink-fg)}
.hacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.conv .convrow{display:flex;align-items:flex-end;gap:10px}
.conv label{flex:1;display:grid;gap:4px;font-weight:800;font-size:13px;color:var(--muted);min-width:0}
.conv input{font:inherit;font-size:20px;font-weight:800;padding:10px 12px;border:0;border-radius:14px;background:var(--bg);color:var(--fg);width:100%}
.conv .convx{font-weight:800;font-size:20px;color:var(--muted);padding-bottom:10px}
.conv .small{margin-top:10px}
.conv label:focus-within{outline:none}
.lbbtn.on{background:#c8f0de;color:#0b6a49}
@media (max-width:720px){.secnav.pub{left:50%;right:auto;transform:translateX(-50%);width:min(320px,calc(100vw - 24px))}}
.pubhero{text-align:center;padding:28px 22px}
.pubhero .daysub{margin:10px auto 0}
.pubh{display:flex;align-items:center;gap:12px;font-size:20px;margin:28px 0 12px}
.pubh .tile{width:38px;height:38px;border-radius:13px}
.pubh .tile svg.i{width:20px;height:20px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.place{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px;text-align:center;text-decoration:none;color:var(--fg);border:0;cursor:pointer;font:inherit;transition:transform .15s}
.place:hover{transform:translateY(-2px)}
.place b{font-weight:800;font-size:14.5px;line-height:1.3}
.place .tile.big{width:64px;height:64px;border-radius:22px}
.place .tile.big svg.i{width:30px;height:30px}
.place.hasph{padding:8px 8px 14px}
.place .pimg{display:block;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--bg)}
.place .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pubgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
@media (max-width:720px){.places{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
#toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
footer{margin-top:36px;color:var(--muted);font-size:13px}

/* ---------- téléphone ---------- */
@media (max-width:720px){
  body{font-size:15px}
  .wrap{padding:0 14px calc(110px + var(--safe-b))}
  nav.days{margin-inline:-14px;padding-inline:14px}
  .hello{padding-top:22px}
  .hero{padding:18px}
  .hfacts{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-18px;padding:0 18px 2px;gap:8px}
  .hfacts::-webkit-scrollbar{display:none}
  .fact{flex:0 0 82%;scroll-snap-align:start}
  .hero{padding-bottom:16px}
  .secnav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));z-index:30;width:auto;margin:0;justify-content:space-between;padding:6px;border-radius:26px;box-shadow:0 10px 30px rgba(200,50,110,.18)}
  .secnav a{flex:1;flex-direction:column;gap:2px;padding:7px 2px 6px;font-size:11px;border-radius:20px;justify-content:center;min-height:54px}
  .secnav a svg.i{width:23px;height:23px}
  .secnav .n{position:absolute;top:4px;left:calc(50% + 5px);padding:0 5px;font-size:10px;line-height:16px}
  #toast{bottom:calc(96px + var(--safe-b))}
  .dayhead{padding:18px}
  .dacts .btn{flex:1}
  .scard{padding:14px 14px 12px}
  .tile{width:42px;height:42px}
  .leg{margin-left:26px;padding-left:18px}
  .pth{width:calc((100% - 24px)/4);height:auto;aspect-ratio:1;max-width:90px}
  .pager .btn{flex:1}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .pgrid .pth{width:auto;max-width:none}
  .lbnav{display:none}
  dialog:not(#lb){width:100vw;max-width:100vw;margin:auto 0 0;border-radius:28px 28px 0 0;max-height:92dvh}
  dialog:not(#lb) .dlg{padding-bottom:calc(22px + var(--safe-b))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<dialog id="tdlg" aria-labelledby="dlgTitle">
  <form id="tForm" class="dlg" method="dialog">
    <h2 id="dlgTitle">Ajouter un billet</h2>
    <div id="tExisting"></div>
    <div class="field"><label for="tKey">Étape</label><select id="tKey"></select></div>
    <div class="field"><label for="tTitle">Nom du billet</label><input id="tTitle" placeholder="ex. London Eye 15h"></div>
    <div class="field"><label for="tRef">N° de réservation</label><input id="tRef" placeholder="ex. LE-48213" autocomplete="off"></div>
    <div class="field"><label for="tNote">Note</label><textarea id="tNote" rows="2" placeholder="ex. 2 adultes, se présenter 15 min avant"></textarea></div>
    <label class="drop">Choisir des fichiers (PDF, photo, capture d'écran)<input type="file" id="tFile" class="vh" accept="application/pdf,image/*" multiple></label>
    <ul id="tFiles"></ul>
    <div class="err" id="tErr" role="alert"></div>
    <div class="dlgbar"><button type="button" class="btn" id="tCancel">Annuler</button><button type="submit" class="btn solid">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="vdlg" aria-labelledby="vTitle">
  <div class="dlg">
    <h2 id="vTitle">Billet</h2>
    <div id="vBody"></div>
    <div class="dlgbar"><a class="btn" id="vOpen" target="_blank" rel="noopener">Ouvrir en plein écran</a><button type="button" class="btn solid" id="vClose">Fermer</button></div>
  </div>
</dialog>

<dialog id="lb" aria-labelledby="lbTitle">
  <div class="lbtop">
    <div class="lbt" id="lbTitle"></div><span class="lbc" id="lbCount"></span>
    <button type="button" class="lbbtn close" id="lbClose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="lbstage" id="lbStage">
    <img id="lbImg" alt="">
    <button type="button" class="lbnav prev" id="lbPrev" aria-label="Photo précédente">‹</button>
    <button type="button" class="lbnav next" id="lbNext" aria-label="Photo suivante">›</button>
  </div>
  <div class="lbbar">
    <label class="vh" for="lbCap">Légende</label>
    <input id="lbCap" placeholder="Ajouter une légende" autocomplete="off" enterkeyhint="done">
    <p id="lbCapRO" style="margin:0;font-weight:700" hidden></p>
    <div class="lbact">
      <button type="button" class="lbbtn" id="lbShare" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Partager</button>
      <button type="button" class="lbbtn" id="lbPub" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/></svg>Récap public</button>
      <a class="lbbtn" id="lbDl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Télécharger</a>
      <button type="button" class="lbbtn danger" id="lbDel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Supprimer</button>
    </div>
  </div>
</dialog>

<dialog id="edlg" aria-labelledby="eTitleH">
  <form id="eForm" class="dlg" method="dialog">
    <h2 id="eTitleH">Ajouter une dépense</h2>
    <div class="field"><label for="eTitle">Quoi ?</label><input id="eTitle" placeholder="Dîner à Soho" autocomplete="off"></div>
    <div class="erow">
      <div class="field" style="flex:1"><label for="eAmount">Montant</label><input id="eAmount" inputmode="decimal" placeholder="42,50" autocomplete="off"></div>
      <div class="field" style="width:96px"><label for="eCur">Devise</label><select id="eCur"><option value="€">€</option><option value="£">£</option></select></div>
    </div>
    <div class="erow">
      <div class="field" style="flex:1"><label for="ePaid">Payé par</label><select id="ePaid"></select></div>
      <div class="field" style="flex:1"><label for="eDate">Date</label><input id="eDate" type="date"></div>
    </div>
    <fieldset class="field split"><legend>Pour qui ? <button type="button" class="link" id="eAll">Tout le monde</button></legend><div id="eSplit" class="chk"></div></fieldset>
    <p class="small" id="eShare" style="font-weight:800;color:var(--primary)"></p>
    <div class="err" id="eErr" role="alert"></div>
    <div class="dlgbar"><button type="button" class="btn danger-soft" id="eDel" hidden>Supprimer</button><span style="flex:1"></span><button type="button" class="btn" id="eCancel">Annuler</button><button type="submit" class="btn solid">Enregistrer</button></div>
  </form>
</dialog>

<dialog id="udlg" aria-labelledby="uTitle">
  <form id="uForm" class="dlg" method="dialog">
    <h2 id="uTitle">Accès privé</h2>
    <p class="small">Entre le code pour voir les horaires, trajets, réservations, billets, budget et comptes.</p>
    <div class="field"><label for="uCode">Code</label><input id="uCode" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="go"></div>
    <label class="small" style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="uRemember" checked style="width:20px;height:20px;accent-color:var(--primary)">Rester déverrouillé sur cet appareil</label>
    <div class="err" id="uErr" role="alert"></div>
    <div class="dlgbar"><button type="button" class="btn" id="uCancel">Annuler</button><button type="submit" class="btn solid">Ouvrir</button></div>
  </form>
</dialog>

<div id="toast" role="status" hidden></div>

<script>self.APPV = "2026-10-18g";</script>
<script src="icons.js?v=2026-10-18g"></script>
<script src="outils/carnet-build.js?v=2026-10-18g"></script>
<script src="voyages.js?v=2026-10-18g"></script>
<script src="app.js?v=2026-10-18g"></script>
</body>
</html>
